name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - package.json
      - package-lock.json
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment: myPorto
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Copy CNAME
        run: |
          if [ -f CNAME ]; then
            cp CNAME dist/CNAME
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v6
        with:
          path: dist

  deploy:
    environment:
      name: myPorto
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6

  tag-release:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump patch version and create tag
        run: |
          NEXT_VERSION="v$(node -e "const v=require('./package.json').version.split('.'); v[2]=parseInt(v[2])+1; console.log(v.join('.'))")"
          if git rev-parse "$NEXT_VERSION" >/dev/null 2>&1; then
            git tag -d "$NEXT_VERSION"
            if git ls-remote --tags origin | grep -q "refs/tags/$NEXT_VERSION$"; then
              git push origin ":refs/tags/$NEXT_VERSION"
            fi
          fi
          npm version patch -m "chore(release): %s [skip ci]"

      - name: Push commit and tag
        run: |
          git push origin HEAD:main
          git push origin --tags
