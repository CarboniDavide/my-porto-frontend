<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // GitHub Pages SPA redirect workaround
      (function() {
        var l = window.location;
        var pathname = l.pathname.replace(/\/$/, "");
        // Only redirect if not already at index.html
        if (!pathname.match(/\/index\.html$/)) {
          var newUrl = "/index.html?redirect=" + encodeURIComponent(l.pathname + l.search + l.hash);
          window.location.replace(newUrl);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
